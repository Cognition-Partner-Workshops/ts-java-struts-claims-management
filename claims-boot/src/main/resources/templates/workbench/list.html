<th:block th:replace="~{fragments/markers :: view('/WEB-INF/jsp/workbench/list.jsp')}"></th:block>
<table class="page" cellpadding="0" cellspacing="0" border="0">
<th:block th:replace="~{fragments/header :: banner}"></th:block>
<tr><td class="content">
<table th:replace="~{fragments/nav :: nav}"></table>
<h2><th:block th:text="#{workbench.list.heading}"></th:block></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{claim.number}"></th:block></th>
<th><th:block th:text="#{claim.status}"></th:block></th>
<th><th:block th:text="#{claim.reserve}"></th:block></th>
<th><th:block th:text="#{claim.adjuster}"></th:block></th></tr>
<th:block th:each="claim : ${claims}">
<tr><td><a th:href="|view.do?claimId=${claim.claimId}|"><th:block th:text="${claim.claimNumber}"></th:block></a></td>
<td><th:block th:replace="~{fragments/markers :: field(|claimStatus_${claim.claimId}|, ${claim.status}, 'text')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(|reserveAmount_${claim.claimId}|, ${claim.reserveAmount}, 'money')}"></th:block></td>
<td><th:block th:text="${claim.assignedAdjuster}"></th:block></td></tr>
</th:block>
</table>
<p><th:block th:text="#{workbench.list.instruction}"></th:block></p>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td>[[${reportAsOfDate}]]</td>
</tr>
</table>
</td></tr>
<tr th:replace="~{fragments/footer :: footer}"></tr>
</table>
<th:block th:replace="~{fragments/footer :: links}"></th:block>
