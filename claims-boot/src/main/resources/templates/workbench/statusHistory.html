<th:block th:replace="~{fragments/markers :: view('/WEB-INF/jsp/workbench/statusHistory.jsp')}"></th:block>
<th:block th:replace="~{fragments/header :: stylesheet}"></th:block>
<table class="page" cellpadding="0" cellspacing="0" border="0">
<th:block th:replace="~{fragments/header :: banner}"></th:block>
<tr><td class="content">
<table th:replace="~{fragments/nav :: nav}"></table>
<h2><th:block th:text="#{jsp.status.history}"></th:block></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.date}"></th:block></th>
<th><th:block th:text="#{jsp.old.status}"></th:block></th>
<th><th:block th:text="#{jsp.new.status}"></th:block></th>
<th><th:block th:text="#{jsp.changed.by}"></th:block></th></tr>
<th:block th:each="history : ${statusHistory}">
<tr>
<td><th:block th:replace="~{fragments/markers :: field(|statusDate_${history.historyId}|, ${history.changeDate}, 'date')}"></th:block></td>
<td><th:block th:text="${history.oldStatus}"></th:block></td>
<td><th:block th:text="${history.newStatus}"></th:block></td>
<td><th:block th:text="${history.changedBy}"></th:block></td>
</tr>
</th:block>
<tr><td colspan="4">The status history is part of the claim audit trail.</td></tr>
</table>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.claim}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('statusHistoryClaim', ${claimId}, 'integer')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.current.status}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('statusHistoryCurrent', ${claimStatus}, 'text')}"></th:block></td></tr>
</table>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td>[[${reportAsOfDate}]]</td>
</tr>
</table>
</td></tr>
<tr th:replace="~{fragments/footer :: footer}"></tr>
</table>
<th:block th:replace="~{fragments/footer :: links}"></th:block>
