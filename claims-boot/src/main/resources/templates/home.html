<html xmlns:th="http://www.thymeleaf.org"><th:block th:replace="~{fragments/layout :: page(~{::main})}"><main th:remove="tag">
<th:block th:replace="~{fragments/ns :: view('/WEB-INF/jsp/home.jsp')}"></th:block>
<h2><span th:text="#{home.heading}" th:remove="tag"></span></h2>
<p><span th:text="#{home.introduction}" th:remove="tag"></span></p>
<table class="dashboard" cellpadding="3" cellspacing="0" border="1">

    <th><span th:text="#{home.column.area}" th:remove="tag"></span></th>
    <th><span th:text="#{home.column.action}" th:remove="tag"></span></th>
</tr>
<tr>
    <td><span th:text="#{home.policyArea}" th:remove="tag"></span></td>

</tr>
<tr>
    <td><span th:text="#{home.claimArea}" th:remove="tag"></span></td>

</tr>

    <td><span th:text="#{home.reportArea}" th:remove="tag"></span></td>

</tr>
</table>
<p><span th:text="#{home.sessionUser}" th:remove="tag"></span>:
<span th:replace="~{fragments/ns :: field('signedInUser',${session.user})}"></span></p>
<th:block th:replace="~{fragments/layout :: screenAudit}"></th:block>
</main></th:block></html>
