<th:block th:replace="~{report/frame :: page('/WEB-INF/jsp/report/closedClaims.jsp', false, ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{report.closed.heading}"></h2>
<p>[[#{jsp.screen.asOf}]]: <th:block th:replace="~{fragments/markers :: field('reportAsOf', ${reportAsOf}, 'date')}"></th:block></p>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{report.claimNumber}"></th>
<th th:text="#{report.closedDate}"></th></tr>
<tr th:each="row : ${reportRows}" th:with="key=${row['claimNumber'] ?: ''}"><td th:text="${row['claimNumber']}"></td>
<td><th:block th:replace="~{fragments/markers :: field(${'closedDate_' + key}, ${row['closedDate']}, 'date')}"></th:block></td></tr>
</table>
<p>[[#{report.closedCount}]]: <th:block th:replace="~{fragments/markers :: field('closedCount', ${reportRowCount}, 'integer')}"></th:block></p>
<p th:text="#{report.closed.note}"></p>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
