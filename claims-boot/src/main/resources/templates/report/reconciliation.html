<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/report/reconciliation.jsp', ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{jsp.claims.reconciliation}"></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{jsp.line}"></th>
<th th:text="#{jsp.premium}"></th>
<th th:text="#{jsp.reserve}"></th>
<th th:text="#{jsp.paid}"></th>
<th th:text="#{jsp.variance}"></th></tr>
<tr th:each="row : ${reportRows}" th:with="key=${row['lineOfBusiness'] ?: ''}">
<td th:text="${row['lineOfBusiness']}"></td>
<td><th:block th:replace="~{fragments/markers :: field(${'reconcilePremium_' + key}, ${row['premiumTotal']}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'reconcileReserve_' + key}, ${row['reserveTotal']}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'reconcilePaid_' + key}, ${row['paidTotal']}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'reconcileVariance_' + key}, ${row['variance']}, 'money')}"></th:block></td>
</tr>
</table>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{jsp.as.of.date}"></th><td><th:block th:replace="~{fragments/markers :: field('reconcileAsOf', ${reportAsOf}, 'date')}"></th:block></td></tr>
<tr>
<th th:text="#{jsp.report.rows}"></th><td><th:block th:replace="~{fragments/markers :: field('reconcileRows', ${reportRowCount}, 'integer')}"></th:block></td></tr>
</table>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
