<th:block th:replace="~{report/frame :: page('/WEB-INF/jsp/report/agedClaims.jsp', false, ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{report.aged.heading}"></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{report.ageBucket}"></th>
<th th:text="#{report.claimCount}"></th>
<th th:text="#{report.reserveTotal}"></th></tr>
<tr th:each="row : ${reportRows}" th:with="key=${row['bucket'] ?: ''}"><td th:text="${row['bucket']}"></td>
<td>
<th:block th:replace="~{fragments/markers :: field(${'agedBucket_' + key}, ${row['claimCount']}, 'integer')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'agedReserve_' + key}, ${row['reserveTotal']}, 'integer')}"></th:block></td></tr>
</table>
<p th:text="#{report.aged.note}"></p>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
