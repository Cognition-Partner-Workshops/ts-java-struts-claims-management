<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/report/premiumDetail.jsp', ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{jsp.premium.detail}"></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{jsp.policy}"></th>
<th th:text="#{jsp.number}"></th>
<th th:text="#{jsp.line}"></th>
<th th:text="#{jsp.premium}"></th>
<th th:text="#{jsp.status}"></th></tr>
<tr th:each="policy : ${policies}" th:with="key=${policy['policyId']}">
<td><th:block th:replace="~{fragments/markers :: field(${'premiumPolicy_' + key}, ${policy['policyId']}, 'integer')}"></th:block></td>
<td th:text="${policy['policyNumber']}"></td>
<td th:text="${policy['lineOfBusiness']}"></td>
<td><th:block th:replace="~{fragments/markers :: field(${'premiumValue_' + key}, ${policy['annualPremium']}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'premiumStatus_' + key}, ${policy['status']}, 'text')}"></th:block></td>
</tr>
</table>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{jsp.policy.rows}"></th><td><th:block th:replace="~{fragments/markers :: field('premiumRows', ${policyCount}, 'integer')}"></th:block></td></tr>
<tr>
<th th:text="#{jsp.as.of.date}"></th><td><th:block th:replace="~{fragments/markers :: field('premiumAsOf', ${reportAsOf}, 'date')}"></th:block></td></tr>
</table>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
