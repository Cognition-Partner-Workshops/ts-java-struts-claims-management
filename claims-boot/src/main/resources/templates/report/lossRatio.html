<th:block th:replace="~{report/frame :: page('/WEB-INF/jsp/report/lossRatio.jsp', true, ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{report.loss.heading}"></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{policy.line}"></th>
<th th:text="#{report.premiumTotal}"></th>
<th th:text="#{report.lossTotal}"></th>
<th th:text="#{report.lossRatio}"></th></tr>
<tr th:each="row : ${reportRows}" th:with="key=${row['lineOfBusiness'] ?: ''}"><td th:text="${row['lineOfBusiness']}"></td>
<td><th:block th:replace="~{fragments/markers :: field(${'premiumTotal_' + key}, ${row['premiumTotal']}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'lossTotal_' + key}, ${row['lossTotal']}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'lossRatio_' + key}, ${row['lossRatio']}, 'money')}"></th:block></td></tr>
</table>
<p th:text="#{report.loss.note}"></p>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
