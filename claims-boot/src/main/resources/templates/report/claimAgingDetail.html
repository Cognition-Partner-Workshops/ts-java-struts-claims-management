<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/report/claimAgingDetail.jsp', ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{jsp.aged.claim.detail}"></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{jsp.claim}"></th>
<th th:text="#{jsp.reported.date}"></th>
<th th:text="#{jsp.status}"></th>
<th th:text="#{jsp.reserve}"></th>
<th th:text="#{jsp.adjuster}"></th></tr>
<tr th:each="claim : ${claims}" th:with="key=${claim['claimId']}">
<td><th:block th:replace="~{fragments/markers :: field(${'agingClaim_' + key}, ${claim['claimId']}, 'integer')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'agingDate_' + key}, ${claim['reportedDate']}, 'date')}"></th:block></td>
<td th:text="${claim['status']}"></td>
<td><th:block th:replace="~{fragments/markers :: field(${'agingReserve_' + key}, ${claim['reserveAmount']}, 'money')}"></th:block></td>
<td th:text="${claim['assignedAdjuster']}"></td>
</tr>
</table>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{jsp.as.of.date}"></th><td><th:block th:replace="~{fragments/markers :: field('agingDetailAsOf', ${reportAsOf}, 'date')}"></th:block></td></tr>
<tr>
<th th:text="#{jsp.claim.count}"></th><td><th:block th:replace="~{fragments/markers :: field('agingDetailCount', ${claimCount}, 'integer')}"></th:block></td></tr>
</table>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
