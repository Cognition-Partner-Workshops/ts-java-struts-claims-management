<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/report/adjusterWorkload.jsp', ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{jsp.adjuster.workload}"></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{jsp.adjuster}"></th>
<th th:text="#{jsp.open.claims}"></th>
<th th:text="#{jsp.reserve.total}"></th>
<th th:text="#{jsp.oldest.report}"></th></tr>
<tr th:each="row : ${reportRows}" th:with="key=${row['adjuster'] ?: ''}">
<td th:text="${row['adjuster']}"></td>
<td><th:block th:replace="~{fragments/markers :: field(${'workloadOpen_' + key}, ${row['openCount']}, 'integer')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'workloadReserve_' + key}, ${row['reserveTotal']}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'workloadOldest_' + key}, ${row['oldestReportedDate']}, 'date')}"></th:block></td>
</tr>
</table>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{jsp.as.of.date}"></th><td><th:block th:replace="~{fragments/markers :: field('workloadAsOf', ${reportAsOf}, 'date')}"></th:block></td></tr>
<tr>
<th th:text="#{jsp.rows.returned}"></th><td><th:block th:replace="~{fragments/markers :: field('workloadRows', ${reportRowCount}, 'integer')}"></th:block></td></tr>
</table>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
