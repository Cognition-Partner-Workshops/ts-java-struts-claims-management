<th:block th:replace="~{report/frame :: page('/WEB-INF/jsp/report/adjusterClaims.jsp', false, ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{report.adjusterClaims.heading}"></h2>
<p>[[#{report.adjuster}]]: <th:block th:replace="~{fragments/markers :: field('adjuster', ${adjuster}, 'text')}"></th:block></p>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{report.claimNumber}"></th>
<th th:text="#{claim.status}"></th>
<th th:text="#{report.reserveTotal}"></th></tr>
<tr th:each="row : ${reportRows}" th:with="key=${row['claimNumber'] ?: ''}"><td th:text="${row['claimNumber']}"></td>
<td><th:block th:replace="~{fragments/markers :: field(${'claimStatus_' + key}, ${row['status']}, 'text')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'reserveAmount_' + key}, ${row['reserveAmount']}, 'money')}"></th:block></td></tr>
</table>
<p>[[#{report.claimCount}]]: <th:block th:replace="~{fragments/markers :: field('claimCount', ${reportRowCount}, 'integer')}"></th:block></p>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
