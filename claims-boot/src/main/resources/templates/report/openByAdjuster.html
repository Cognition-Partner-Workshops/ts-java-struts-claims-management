<th:block th:replace="~{report/frame :: page('/WEB-INF/jsp/report/openByAdjuster.jsp', false, ~{::content})}"><th:block th:fragment="content">
<h2 th:text="#{report.open.heading}"></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th th:text="#{report.adjuster}"></th>
<th th:text="#{report.openCount}"></th>
<th th:text="#{report.reserveTotal}"></th></tr>
<tr th:each="row : ${reportRows}" th:with="key=${row['adjuster'] ?: ''}"><td th:text="${row['adjuster']}"></td>
<td>
<th:block th:replace="~{fragments/markers :: field(${'openCount_' + key}, ${row['openCount']}, 'integer')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'reserveTotal_' + key}, ${row['reserveTotal']}, 'money')}"></th:block></td></tr>
</table>
<p th:text="#{report.open.note}"></p>
<table th:replace="~{report/frame :: audit}"></table>
</th:block></th:block>
