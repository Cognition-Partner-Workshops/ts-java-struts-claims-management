<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/policy/coverages.jsp', ~{::content})}"><th:block th:fragment="content">
<h2><th:block th:text="#{coverage.heading}"></th:block></h2>
<table class="details" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{policy.number}"></th:block></th><td><th:block th:text="${policy.policyNumber}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{coverage.limit}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('coverageLimit', ${policy.policyLimit}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{coverage.deductible}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('coverageDeductible', ${policy.deductible}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{coverage.description}"></th:block></th><td><th:block th:text="#{coverage.standard}"></th:block></td></tr>
</table>
<p><th:block th:text="#{coverage.note}"></th:block></p>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td><th:block th:text="${reportAsOfDate}"></th:block></td>
</tr>
</table>
</th:block></th:block>
