<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/policy/list.jsp', ~{::content})}"><th:block th:fragment="content">
<h2><th:block th:text="#{policy.list.heading}"></th:block></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{policy.number}"></th:block></th>
<th><th:block th:text="#{policy.line}"></th:block></th>
<th><th:block th:text="#{policy.insured}"></th:block></th>
<th><th:block th:text="#{policy.limit}"></th:block></th>
<th><th:block th:text="#{policy.status}"></th:block></th></tr>
<th:block th:each="policy : ${policies}">
<tr><td><a th:href="|${'view.do?policyId='}${policy.policyId}|"><th:block th:text="${policy.policyNumber}"></th:block></a></td>
<td><th:block th:text="${policy.lineOfBusiness}"></th:block></td>
<td><th:block th:text="${policy.insuredName}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'policyLimit_' + policy.policyId}, ${policy.policyLimit}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'policyStatus_' + policy.policyId}, ${policy.status}, 'text')}"></th:block></td></tr>
</th:block>
</table>
<p><th:block th:text="#{policy.list.instruction}"></th:block></p>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td><th:block th:text="${reportAsOfDate}"></th:block></td>
</tr>
</table>
</th:block></th:block>
