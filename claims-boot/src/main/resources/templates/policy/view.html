<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/policy/view.jsp', ~{::content})}"><th:block th:fragment="content">
<h2><th:block th:text="#{policy.view.heading}"></th:block></h2>
<table class="details" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{policy.number}"></th:block></th><td><th:block th:text="${policy.policyNumber}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{policy.insured}"></th:block></th><td><th:block th:text="${policy.insuredName}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{policy.address}"></th:block></th><td><th:block th:text="${policy.insuredAddress}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{policy.limit}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('policyLimit', ${policy.policyLimit}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{policy.deductible}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('deductibleApplied', ${policy.deductible}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{policy.status}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('policyStatus', ${policy.status}, 'text')}"></th:block></td></tr>
</table>
<p><a th:href="|${'coverages.do?policyId='}${policy.policyId}|"><th:block th:text="#{policy.coverageLink}"></th:block></a></p>
<p><a th:href="|${'coverageDetail.do?policyId='}${policy.policyId}|"><th:block th:text="#{policy.coverageDetailLink}"></th:block></a> |
<a th:href="|${'insuredParty.do?policyId='}${policy.policyId}|"><th:block th:text="#{policy.insuredDetailLink}"></th:block></a> |
<a th:href="|${'renewal.do?policyId='}${policy.policyId}|"><th:block th:text="#{policy.renewalLink}"></th:block></a></p>
<p><a th:href="|${'coverageDetail.do?policyId='}${policy.policyId}|"><th:block th:text="#{policy.coverageDetailLink}"></th:block></a> |
<a th:href="|${'insuredParty.do?policyId='}${policy.policyId}|"><th:block th:text="#{policy.insuredDetailLink}"></th:block></a> |
<a th:href="|${'renewal.do?policyId='}${policy.policyId}|"><th:block th:text="#{policy.renewalLink}"></th:block></a></p>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td><th:block th:text="${reportAsOfDate}"></th:block></td>
</tr>
</table>
</th:block></th:block>
