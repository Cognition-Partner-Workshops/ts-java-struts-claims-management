<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/policy/renewal.jsp', ~{::content})}"><th:block th:fragment="content">
<h2><th:block th:text="#{jsp.policy.renewal.review}"></th:block></h2>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.policy.identifier}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('renewalPolicyId', ${policy.policyId}, 'integer')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.policy.number}"></th:block></th><td><th:block th:text="${policy.policyNumber}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.line}"></th:block></th><td><th:block th:text="${policy.lineOfBusiness}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.expiration}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('renewalExpiration', ${policy.expiryDate}, 'date')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.limit}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('renewalLimit', ${policy.policyLimit}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.deductible}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('renewalDeductible', ${policy.deductible}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.status}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('renewalStatus', ${policy.status}, 'text')}"></th:block></td></tr>
</table>
<table class="instructions" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.review.item}"></th:block></th>
<th><th:block th:text="#{jsp.required.check}"></th:block></th></tr>
<tr><td><th:block th:text="#{jsp.expiration}"></th:block></td>
<td><th:block th:text="#{jsp.review.expiration}"></th:block></td></tr>
<tr><td><th:block th:text="#{jsp.limit}"></th:block></td>
<td><th:block th:text="#{jsp.review.limit}"></th:block></td></tr>
<tr><td><th:block th:text="#{jsp.deductible}"></th:block></td>
<td><th:block th:text="#{jsp.review.deductible}"></th:block></td></tr>
<tr><td><th:block th:text="#{jsp.coverage}"></th:block></td>
<td><th:block th:text="#{jsp.review.coverage}"></th:block></td></tr>
</table>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td><th:block th:text="${reportAsOfDate}"></th:block></td>
</tr>
</table>
</th:block></th:block>
