<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/policy/coverageDetail.jsp', ~{::content})}"><th:block th:fragment="content">
<h2><th:block th:text="#{jsp.policy.coverage.detail}"></th:block></h2>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.policy}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('coveragePolicyId', ${policy.policyId}, 'integer')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.policy.number}"></th:block></th><td><th:block th:text="${policy.policyNumber}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.line.of.business}"></th:block></th><td><th:block th:text="${policy.lineOfBusiness}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.policy.limit}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('coveragePolicyLimit', ${policy.policyLimit}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.deductible}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('coverageDeductible', ${policy.deductible}, 'money')}"></th:block></td></tr>
</table>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.coverage.code}"></th:block></th>
<th><th:block th:text="#{jsp.description}"></th:block></th>
<th><th:block th:text="#{jsp.limit}"></th:block></th>
<th><th:block th:text="#{jsp.status}"></th:block></th></tr>
<th:block th:each="coverage : ${coverages}">
<tr>
<td><th:block th:text="${coverage.coverageCode}"></th:block></td>
<td><th:block th:text="${coverage.description}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'coverageLimit_' + coverage.coverageId}, ${coverage.limit}, 'money')}"></th:block></td>
<td><th:block th:text="${coverage.status}"></th:block></td>
</tr>
</th:block>
</table>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td><th:block th:text="${reportAsOfDate}"></th:block></td>
</tr>
</table>
</th:block></th:block>
