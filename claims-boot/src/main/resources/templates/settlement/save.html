<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/settlement/save.jsp', ~{::content})}"><th:block th:fragment="content">
<h2><th:block th:text="#{settlement.saved.heading}"></th:block></h2>
<table class="details" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{settlement.amount}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('settlementAmount', ${settlementAmount}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{settlement.savedBy}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('savedBy', ${session.user}, 'text')}"></th:block></td></tr>
</table>
<p><th:block th:text="#{settlement.saved.message}"></th:block></p>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td><th:block th:text="${reportAsOfDate}"></th:block></td>
</tr>
</table>

</th:block></th:block>
