<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/settlement/detail.jsp', ~{::content})}"><th:block th:fragment="content">
<h2><th:block th:text="#{jsp.settlement.detail}"></th:block></h2>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.settlement.number}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('detailSettlementId', ${settlement == null ? null : settlement.settlementId}, 'integer')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.claim.number}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('detailClaimId', ${settlement == null ? null : settlement.claimId}, 'integer')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.covered.amount}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('detailCoveredAmount', ${settlement == null ? null : settlement.coveredAmount}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.deductible.applied}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('detailDeductible', ${settlement == null ? null : settlement.deductibleApplied}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.depreciation}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('detailDepreciation', ${settlement == null ? null : settlement.depreciation}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.policy.cap.applied}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('detailCapped', ${settlement == null ? null : settlement.cappedAtLimit}, 'text')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.settlement.amount}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('detailAmount', ${settlement == null ? null : settlement.settlementAmount}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.calculated.by}"></th:block></th><td><th:block th:text="${settlement == null ? null : settlement.calculatedBy}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{jsp.calculated.date}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('detailDate', ${settlement == null ? null : settlement.calculatedDate}, 'date')}"></th:block></td></tr>
</table>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td><th:block th:text="${reportAsOfDate}"></th:block></td>
</tr>
</table>

</th:block></th:block>
