<th:block th:replace="~{fragments/layout :: page('/WEB-INF/jsp/settlement/calculate.jsp', ~{::content})}"><th:block th:fragment="content">
<h2><th:block th:text="#{settlement.heading}"></th:block></h2>
<p><a th:href="@{detail.do(claimId=${settlement.claimId})}"><th:block th:text="#{settlement.detailLink}"></th:block></a></p>
<table class="details" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{settlement.covered}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('coveredAmount', ${settlement.coveredAmount}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{settlement.deductible}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('deductibleApplied', ${settlement.deductibleApplied}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{settlement.depreciation}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('depreciation', ${settlement.depreciation}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{settlement.capped}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('cappedAtLimit', ${settlement.cappedAtLimit}, 'money')}"></th:block></td></tr>
<tr>
<th><th:block th:text="#{settlement.amount}"></th:block></th><td><th:block th:replace="~{fragments/markers :: field('settlementAmount', ${settlement.settlementAmount}, 'money')}"></th:block></td></tr>
</table>
<p><a th:href="@{save.do(claimId=${settlement.claimId})}"><th:block th:text="#{settlement.save}"></th:block></a></p>
<table class="screen-audit" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><th:block th:text="#{jsp.screen.context}"></th:block></th>
<td><th:block th:text="#{jsp.screen.readOnly}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.operator}"></th:block></th>
<td><th:block th:text="${user}"></th:block></td>
</tr>
<tr>
<th><th:block th:text="#{jsp.screen.asOf}"></th:block></th>
<td><th:block th:text="${reportAsOfDate}"></th:block></td>
</tr>
</table>

</th:block></th:block>
