<th:block th:replace="~{payment/fragments :: page('/WEB-INF/jsp/payment/remittance.jsp', ~{::content}, true)}"><th:block th:fragment="content">
<h2 th:text="#{jsp.payment.remittance}"></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr><th th:text="#{jsp.check}"></th><th th:text="#{jsp.payee}"></th><th th:text="#{jsp.issued.date}"></th><th th:text="#{jsp.amount}"></th><th th:text="#{jsp.status}"></th></tr>
<tr th:each="payment : ${payments}">
<td><th:block th:replace="~{fragments/markers :: field(${'remitCheck_' + payment.paymentId}, ${payment.checkNumber}, 'text')}"></th:block></td>
<td th:text="${payment.payeeName}"></td>
<td><th:block th:replace="~{fragments/markers :: field(${'remitDate_' + payment.paymentId}, ${payment.issuedDate}, 'date')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'remitAmount_' + payment.paymentId}, ${payment.amount}, 'money')}"></th:block></td>
<td><th:block th:replace="~{fragments/markers :: field(${'remitStatus_' + payment.paymentId}, ${payment.status}, 'text')}"></th:block></td>
</tr>
</table>
<table class="detail" cellpadding="3" cellspacing="0" border="1">
<tr><th th:text="#{jsp.claim}"></th><td><th:block th:replace="~{fragments/markers :: field('remitClaimId', ${claimId}, 'integer')}"></th:block></td></tr>
<tr><th th:text="#{jsp.payment.count}"></th><td><th:block th:replace="~{fragments/markers :: field('remitCount', ${paymentCount}, 'integer')}"></th:block></td></tr>
<tr><th th:text="#{jsp.total.issued}"></th><td><th:block th:replace="~{fragments/markers :: field('remitTotal', ${paymentTotal}, 'money')}"></th:block></td></tr>
</table>
<table th:replace="~{payment/fragments :: audit}"></table>
</th:block></th:block>
