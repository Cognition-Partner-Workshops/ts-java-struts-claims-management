<th:block th:replace="~{payment/fragments :: page('/WEB-INF/jsp/payment/issue.jsp', ~{::content}, false)}"><th:block th:fragment="content">
<h2 th:text="#{payment.issue.heading}"></h2>
<table class="details" cellpadding="3" cellspacing="0" border="1">
<tr><th th:text="#{payment.amount}"></th><td><th:block th:replace="~{fragments/markers :: field('paymentAmount', ${paymentAmount}, 'money')}"></th:block></td></tr>
<tr><th th:text="#{payment.check}"></th><td><th:block th:replace="~{fragments/markers :: field('checkNumber', ${checkNumber}, 'text')}"></th:block></td></tr>
<tr><th th:text="#{payment.status}"></th><td><th:block th:replace="~{fragments/markers :: field('paymentStatus', ${paymentStatus}, 'text')}"></th:block></td></tr>
</table>
<p th:text="#{payment.issue.message}"></p>
<table th:replace="~{payment/fragments :: audit}"></table>
</th:block></th:block>
