<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/ns :: view('/WEB-INF/jsp/home.jsp')}"></th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}">
<main th:remove="tag">
<h2 th:text="#{home.heading}"></h2>
<p th:text="#{home.introduction}"></p>
<table class="dashboard" cellpadding="3" cellspacing="0" border="1">
<tr><th th:text="#{home.column.area}"></th><th th:text="#{home.column.action}"></th></tr>
<tr><td th:text="#{home.policyArea}"></td><td><a href="policy/list.do" th:text="#{home.policyLink}"></a></td></tr>
<tr><td th:text="#{home.claimArea}"></td><td><a href="workbench/list.do" th:text="#{home.claimLink}"></a></td></tr>
<tr><td th:text="#{home.reportArea}"></td><td><a href="report/index.do" th:text="#{home.reportLink}"></a></td></tr>
</table>
<p>[[#{home.sessionUser}]]:
<th:block th:replace="~{fragments/ns :: field('signedInUser',${session.user})}"></th:block></p>
<th:block th:replace="~{fragments/layout :: screenAudit}"></th:block>
</main>
</th:block>
